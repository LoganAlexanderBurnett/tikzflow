# Runs the tests on every push and pull request (SPEC Milestone 5, moved to M5 step 0 by D89):
# strict type checks, Vitest (with the engine, so the TeX tests run too), the production build and
# its Cloudflare Pages checks, and the Playwright tests in Edge, including the offline ones.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Typecheck, Vitest, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The engine is not in git (D8): the pinned release, checked by its SHA-256 (engine/release.json).
      - name: Cache the engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/engine
          key: engine-${{ hashFiles('engine/release.json') }}

      - run: npm run fetch-engines -- engine

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:dist

  # The templates (D95) must compile with real LaTeX too, not only with our engine (the Vitest job):
  # pdfLaTeX in the pinned TeX Live 2026 image the engine is built from, through Google's mirror of
  # Docker Hub by the same digest (as page-widths.yml). Any error or LaTeX warning fails the job; the
  # PDFs are kept as an artifact.
  templates:
    name: Templates (pdfLaTeX)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mirror.gcr.io/texlive/texlive@sha256:f1c4d2c23f297caee8654dc23eed022c854ca59e899e40666abbd45bab70dceb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile every template
        run: |
          mkdir -p out
          failed=0
          for f in src/templates/*.tex; do
            name=$(basename "$f" .tex)
            if ! pdflatex -interaction=nonstopmode -halt-on-error -output-directory=out "$f" > /dev/null; then
              echo "::error file=$f::$name doesn't compile with pdfLaTeX"
              grep -A6 '^!' "out/$name.log" || tail -n 30 "out/$name.log"
              failed=1
            elif grep -E 'LaTeX Warning|Package [A-Za-z]+ Warning|Overfull|Underfull|Missing character' "out/$name.log"; then
              echo "::error file=$f::$name compiles with warnings"
              failed=1
            else
              echo "$name: ok"
            fi
          done
          exit $failed

      - name: Keep the PDFs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: templates-pdf
          path: out/*.pdf

  e2e:
    name: Playwright (Edge)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Cache the engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/engine
          key: engine-${{ hashFiles('engine/release.json') }}

      - run: npm run fetch-engines -- engine

      - name: Install Edge
        run: npx playwright install --with-deps msedge

      - run: npm run grammar
      - run: npm run test:e2e
      - run: npm run test:offline
